          start-motion.js
          start.css
          FILES
      - name: Guardar archivos en GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets "*.css" "*.js" "*.html"
          git commit -m "Subir versión final de START Brand [skip ci]"
          git push
