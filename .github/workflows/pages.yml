name: Publicar START Brand en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Preparar sitio
        shell: bash
        env:
          SOURCE: https://http-brand-x-immersive.iaravalentino33.chatgpt.site
        run: |
          set -euo pipefail
          mkdir -p _site
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            mkdir -p "_site/$(dirname "$file")"
            curl --retry 3 --retry-all-errors --location --fail --silent --show-error "$SOURCE/$file" --output "_site/$file"
          done <<'FILES'
